<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de zonas | Avellaneda</title>
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css">
    <link rel="stylesheet" href="node_modules/leaflet-draw/dist/leaflet.draw.css">
    <link rel="stylesheet" href="src/estilos.css?v=8">
</head>
<body>
    <main class="espacio-trabajo">
        <div class="mapa" aria-label="Mapa interactivo de Avellaneda"></div>
        <aside class="panel-editor" aria-label="Editor de zonas">
            <div class="encabezado-editor">
                <p class="etiqueta-superior">AVELLANEDA </p>
                <h1>Areas de trabajo</h1>
            </div>
            <p class="estado-editor" role="status" aria-live="polite">Elige un color y rodea las cuadras</p>
            <p class="estado-puntos" role="status" aria-live="polite">Cargando puntos de interés...</p>
            <div class="selector-colores" role="group" aria-label="Color de zona">
                <button class="opcion-color" type="button" data-color="azul" aria-label="Azul" aria-pressed="true"><span class="muestra-color azul"></span><span>Zona de Parking</span></button>
                <button class="opcion-color" type="button" data-color="verde" aria-label="Verde" aria-pressed="false"><span class="muestra-color verde"></span><span>Zona de corte</span></button>
                <button class="opcion-color" type="button" data-color="amarillo" aria-label="Amarillo" aria-pressed="false"><span class="muestra-color amarillo"></span><span>Zona de Filmacion</span></button>
            </div>
            <div class="acciones-editor">
                <button class="accion-principal" type="button" aria-pressed="false">Dibujar zona</button>
                <button class="accion-icono" type="button" aria-label="Borrar zona seleccionada" title="Borrar zona seleccionada" disabled>&times;</button>
            </div>
            <div class="pie-editor">
                <span class="contador-zonas">0 zonas</span>
                <button class="accion-texto accion-exportar" type="button">Enviar</button>
            </div>
        </aside>
    </main>
    <script src="node_modules/leaflet/dist/leaflet.js"></script>
    <script src="node_modules/leaflet-draw/dist/leaflet.draw.js"></script>
    <script src="node_modules/@turf/turf/turf.min.js"></script>
    <script src="src/index.js"></script>
</body>
</html>
